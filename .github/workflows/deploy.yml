name: deploy

# main 머지가 아니라 semver 태그가 배포를 결정한다 (docs/deployment.md D4).
# 재시작은 LoRa 수신을 끊으므로 시점을 사람이 고른다.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Pi가 1대다. 배포가 겹치면 서로의 체크아웃을 덮는다.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    # 시크릿이 이 환경에 묶여 있다. 선언하지 않으면 secrets.*가 전부 빈 문자열로
    # 넘어가고, 실패가 아니라 "인증 없이 붙으려다 거부됨"으로 나타난다.
    environment: prod
    steps:
      # Pi는 NAT 뒤에 있다. Access 뒤의 SSH에 닿는 유일한 경로다 (D3).
      - name: cloudflared 설치
        run: |
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: SSH 자격 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      # 시크릿이 비어 있으면 Pi에 이미 있는 .env를 그대로 쓴다 — 이 경로를 켜기
      # 전과 같은 동작이라, 결정을 되돌리는 데 코드 변경이 필요 없다.
      - name: .env 배치
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
        run: |
          if [ -z "$APP_ENV_FILE" ]; then
            echo "APP_ENV_FILE 없음 — Pi의 .env를 그대로 쓴다"
            exit 0
          fi
          # 통째로 덮는 파일이다. 잘린 내용을 받으면 빠진 키가 기본값으로 조용히
          # 떨어진다 — APP_PUSH_DELIVERY 한 줄이 사라지면 푸시가 로그로만 간다.
          # 파일이 온전한지 값싸게 확인할 수 있는 두 가지만 본다.
          printf '%s\n' "$APP_ENV_FILE" | grep -q '^APP_ENVIRONMENT=' || {
            echo "APP_ENVIRONMENT가 없다 — 잘린 내용으로 .env를 덮지 않는다"; exit 1
          }
          lines=$(printf '%s\n' "$APP_ENV_FILE" | grep -cE '^APP_[A-Z_]+=')
          echo "APP_ENV_FILE: 키 ${lines}개"
          [ "$lines" -ge 10 ] || { echo "키가 너무 적다 — 잘린 내용으로 보인다"; exit 1; }
          # 내용은 stdin으로만 보낸다. 명령줄에 실으면 Pi의 ps에 그대로 보인다.
          printf '%s\n' "$APP_ENV_FILE" | ssh \
            -o ProxyCommand="cloudflared access ssh --hostname %h \
                  --service-token-id $CF_ACCESS_CLIENT_ID \
                  --service-token-secret $CF_ACCESS_CLIENT_SECRET" \
            -o ConnectTimeout=30 \
            "user@$DEPLOY_HOST" \
            'umask 077 && mkdir -p ~/backend/data/backups \
             && cp -f ~/backend/.env ~/backend/data/backups/env.prev 2>/dev/null || true; \
             cat > ~/backend/.env.incoming && mv ~/backend/.env.incoming ~/backend/.env \
             && echo ".env 배치 완료"'

      # deploy.sh가 SSOT다. 여기서 배포 절차를 다시 쓰지 않는다.
      # 실패하면 deploy.sh가 스스로 롤백하고 0이 아닌 코드로 끝난다.
      - name: 배포
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh -o ProxyCommand="cloudflared access ssh --hostname %h \
                --service-token-id $CF_ACCESS_CLIENT_ID \
                --service-token-secret $CF_ACCESS_CLIENT_SECRET" \
              -o ConnectTimeout=30 \
              "user@$DEPLOY_HOST" \
              "cd ~/backend && git fetch --all --tags && ./deploy/deploy.sh '$GITHUB_REF_NAME'"

      # deploy.sh의 헬스체크는 localhost다. 터널·DNS·Access가 깨졌어도 통과한다.
      # 앱이 실제로 쓰는 경로를 밖에서 확인해야 배포가 끝난 것이다.
      - name: 공개 경로 검증
        env:
          PUBLIC_HEALTH_URL: ${{ secrets.PUBLIC_HEALTH_URL }}
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS -m 15 "$PUBLIC_HEALTH_URL" | tee /dev/stderr | grep -q '"status":"ok"'; then
              exit 0
            fi
            echo "재시도 $attempt/10"
            sleep 6
          done
          echo "공개 경로에서 확인하지 못했다"
          exit 1

      # deploy.sh가 실패한 경우는 이미 되돌아갔다. 이 단계가 잡는 것은
      # "Pi에서는 성공했는데 밖에서 안 보이는" 경우뿐이다.
      - name: 공개 검증 실패 시 롤백
        if: failure() && steps.deploy.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh -o ProxyCommand="cloudflared access ssh --hostname %h \
                --service-token-id $CF_ACCESS_CLIENT_ID \
                --service-token-secret $CF_ACCESS_CLIENT_SECRET" \
              -o ConnectTimeout=30 \
              "user@$DEPLOY_HOST" \
              "cd ~/backend && ./deploy/rollback.sh"

[project]
name = "orca-backend"
version = "0.1.0"
description = "EV 배터리 화재 조기감지 백엔드 — LoRa 수신 + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # import 정렬
    "UP",    # pyupgrade
    "B",     # bugbear
    "ASYNC", # async 오용 — 이 프로젝트의 실제 위험
    "SIM",   # 단순화
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts"]

[[tool.mypy.overrides]]
# ARM 하드웨어 라이브러리는 타입 스텁이 없다. 개별 지정 — 전역 무시 금지.
module = ["spidev.*", "gpiozero.*", "firebase_admin.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: 기본 실행에서 제외 가능한 느린 테스트"]

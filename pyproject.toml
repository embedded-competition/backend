[project]
name = "orca-backend"
version = "0.1.0"
description = "EV 배터리 화재 조기감지 백엔드 — LoRa 수신 + FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    # 런타임 의존이다. app.main → runtime.wiring → infrastructure.push.expo가
    # 무조건 import하므로 dev group에 두면 `uv sync --no-dev` 배포가 뜨지 않는다.
    "httpx>=0.28",
]

[project.optional-dependencies]
# Pi 전용 하드웨어 라이브러리. 선언하지 않으면 `uv sync --frozen`이 lock에 없는
# 패키지로 보고 venv에서 지운다 — 배포 때마다 LoRa가 조용히 죽는 경로다.
# 마커로 linux에 묶어 Mac·CI 해석을 막는다.
pi = [
    "spidev>=3.6; sys_platform == 'linux'",
    # SX1276 NRESET 제어. 없으면 칩을 이상 상태에서 꺼낼 방법이 없다.
    "gpiozero>=2.0; sys_platform == 'linux'",
    # RYLR은 AT 명령을 UART로 주고받는다. 보율·타임아웃을 termios로 직접 다루면
    # 플랫폼별 상수에 매달리게 된다.
    "pyserial>=3.5; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.13",
    "deptry>=0.20",
    "vulture>=2.14",
    "hypothesis>=6.125",
    "schemathesis>=4.0",
    "mutmut>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py312"
line-length = 100

# 금지형 규칙만 켠다. "X가 존재해야 한다" 류(ANN·D)는 넣지 않는다 —
# 규모에 맞는 구조를 막고 빈 칸 채우기를 유발한다. 부재·과잉은 lint가 아니라
# 리뷰가 잡는다.
[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # import 정렬
    "UP",    # pyupgrade
    "B",     # bugbear
    "ASYNC", # async 오용 — 이 프로젝트의 실제 위험
    "SIM",   # 단순화
    "RUF",
    "DTZ",   # naive datetime — timestamps.require_aware 불변식의 정적 짝
    "S",     # bandit. S101(assert)이 프로덕션 불변식 검사를 막는다
    "TID",   # 상대 import 금지 (layer.md)
    "FAST",  # FastAPI — Annotated 의존성, 미사용 path param
    "RET",   # 불필요한 else/return — 생활체조 "else 금지"의 자동 강제
    "ARG",   # 미사용 인자
    "SLF",   # private 멤버 외부 접근
    "FBT",   # boolean trap (positional bool)
    "ERA",   # 주석 처리된 코드 (cleancode.md)
    "C90",   # 순환 복잡도
    "PL",    # pylint — 인자 수·매직값·분기 수
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
# cleancode.md의 "인자 ≤2"는 목표값이고 여기 값은 강제 가능한 하한이다.
# 키워드 전용 인자는 호출부 가독성을 해치지 않아 5까지 허용한다.
max-args = 5

[tool.ruff.lint.per-file-ignores]
# 코드에 # noqa를 달지 않기로 했으므로 억제 근거는 전부 여기 적는다.
# 하드웨어 라이브러리는 ARM 전용이라 최상위 import하면 Mac·CI에서 모듈 로드
# 자체가 실패한다. 계층 회피가 아니라 플랫폼 격리다.
"app/infrastructure/lora/spi.py" = ["PLC0415"]
"app/infrastructure/lora/gpio.py" = ["PLC0415"]
"app/infrastructure/lora/rylr/serial_at_port.py" = ["PLC0415"]
# _TOKEN_PREFIX는 비밀값이 아니라 토큰 문자열의 종류 식별 prefix다.
"app/core/identity.py" = ["S105"]
# device_id는 AuthenticatedDevice 의존성이 Path로 받아 소유권 검증에 쓴다.
# ruff는 의존성 시그니처를 따라가지 못한다.
"app/api/routes/devices.py" = ["FAST003"]
# 테스트는 assert가 도구이고, 기대값 리터럴이 곧 명세다.
"tests/*" = [
    "S101", "S105", "S106", "S107",  # assert·더미 토큰이 테스트의 도구다
    "PLR2004",                        # 기대값 리터럴이 곧 명세다
    "SLF001",                         # 내부 상태 단정은 테스트의 권한
    "PLR0913", "ARG001", "ARG002",    # fixture 주입은 인자 수로 세지 않는다
    "FBT001",                         # parametrize의 bool 기대값
]
# 아키텍처 규칙은 위반 코드를 문자열 fixture로 들고 있다.
"tests/architecture/*" = ["ERA001"]
# Alembic 자동 생성 리비전은 포맷을 손대지 않는다.
"migrations/versions/*" = ["ERA001", "E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
# migrations도 포함한다 — autogenerate가 커스텀 타입 import를 빠뜨리는 사고를
# 실행 전에 잡는다 (초기 리비전에서 실제로 발생했다).
files = ["app", "tests", "scripts", "migrations"]

[[tool.mypy.overrides]]
# ARM 하드웨어 라이브러리는 타입 스텁이 없다. 개별 지정 — 전역 무시 금지.
module = ["spidev.*", "gpiozero.*", "serial.*", "firebase_admin.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# contract는 스펙에서 케이스를 생성하느라 느리다 — `make deep`에서만 돈다.
addopts = "-q --strict-markers -m 'not contract'"
markers = [
    "slow: 기본 실행에서 제외 가능한 느린 테스트",
    "contract: OpenAPI 스펙에서 생성한 계약 테스트 (느림 — make deep에서 실행)",
]

# ---------------------------------------------------------------- deptry
# 선언한 의존성과 실제 import를 대조한다. 로컬은 dev 포함 설치라
# `uv sync --no-dev` 배포에서만 터지는 누락을 잡지 못한다.
[tool.deptry]
known_first_party = ["app"]

# 배포명과 import명이 다른 패키지. 적지 않으면 pyserial은 "선언했는데 안 쓴다",
# serial은 "쓰는데 선언 안 했다"로 동시에 잡힌다.
[tool.deptry.package_module_name_map]
pyserial = ["serial"]

[tool.deptry.per_rule_ignores]
# ASGI 서버는 CLI로만 쓴다 — import 되지 않는 것이 정상.
DEP002 = ["uvicorn"]

# ---------------------------------------------------------------- vulture
# tests를 스캔에 넣으면 테스트만 부르는 코드가 살아 있는 것으로 보인다 — 유스케이스
# 어디에서도 안 쓰이는 도메인 규칙이 그렇게 쌓였다. app만 스캔해 "제품 경로에서
# 죽은 것"을 드러낸다. 프레임워크가 이름으로 호출하는 것만 제외하고, 남은 필드 선언
# 잡음은 whitelist가 흡수한다.
[tool.vulture]
paths = ["app", "migrations", "scripts", "vulture_whitelist.py"]
min_confidence = 60
sort_by_size = true
ignore_decorators = [
    "@router.get",
    "@router.post",
    "@app.exception_handler",
]

# ---------------------------------------------------------------- mutmut
# 커버리지는 "실행됨"만 증명한다. 순수 계산 층에서만 돌려 "검증됨"을 확인한다.
[tool.mutmut]
source_paths = ["app/domain/", "app/core/"]
# 순수 계산 층만 변이시키되, 그 층을 실제로 덮는 테스트는 unit+integration 양쪽에
# 있다. unit만 지정하면 대부분이 "no tests"로 빠져 결과가 공허해진다.
pytest_add_cli_args_test_selection = ["tests/unit/", "tests/integration/"]
# mutate 대상만 복사하면 conftest가 import하는 나머지 계층이 없어 수집이 깨진다.
# 변이는 domain·core에만 넣고, 앱 전체는 그대로 복사해 import를 성립시킨다.
also_copy = [
    "app/api/",
    "app/runtime/",
    "app/infrastructure/",
    "app/main.py",
    "migrations/",
    "alembic.ini",
]

# ---------------------------------------------------------------- import-linter
# 계층 경계를 관습이 아니라 계약으로 강제한다. grep 검증의 대체물이고
# 순환 import도 같이 잡는다 (Java의 ArchUnit 대응).
[tool.importlinter]
root_package = "app"
# 외부 패키지 금지 계약(fastapi·sqlalchemy 등)을 쓰려면 필요하다.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "계층 방향 (api → runtime → core → domain)"
type = "layers"
# runtime = 조립 + 비-HTTP 구동 어댑터. 조립부는 모든 계층을 알아야 하므로
# core 위에 두되 api 아래에 둔다.
layers = ["app.api", "app.runtime", "app.core", "app.domain"]

[[tool.importlinter.contracts]]
name = "domain은 외부 프레임워크를 모른다"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic", "httpx", "spidev"]

[[tool.importlinter.contracts]]
name = "core는 프레임워크를 직접 쓰지 않는다"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "spidev", "app.api", "app.runtime"]
# 저장소 어댑터를 거친 전이 의존은 허용한다. 직접 import만 막아 쿼리가
# core로 새어드는 것을 차단한다.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "core는 db 외 어댑터를 모른다"
type = "forbidden"
source_modules = ["app.core"]
# app.infrastructure.db는 의도적 예외다. 저장소 Protocol은 구현이 하나뿐이라
# 타입 중복만 만들어 제거했고, 그 대가로 core가 저장소 구현 타입을 참조한다.
# 두 번째 구현이 생기면 Protocol을 복원하고 이 예외를 지운다.
forbidden_modules = ["app.infrastructure.lora", "app.infrastructure.push"]

[[tool.importlinter.contracts]]
# 라우터·DTO에 쿼리 조각이 새는 것을 그래프 레벨에서 막는다.
# app.api 전체가 아니라 routes·schemas만 거는 이유: health 라우터가
# `text("SELECT 1")`로 DB 생존을 확인한다. 그건 의도적 예외이므로
# 계약 범위를 좁혀 명시한다 — 예외를 넓히는 대신 대상을 좁힌다.
name = "라우터·DTO는 영속성 기술을 모른다"
type = "forbidden"
source_modules = ["app.api.routes.devices", "app.api.routes.telemetry", "app.api.routes.alerts", "app.api.schemas"]
forbidden_modules = ["sqlalchemy"]
# 저장소 어댑터를 거친 전이 의존은 정상이다. 직접 import만 막아 쿼리 조각이
# 라우터·DTO로 새는 것을 차단한다.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "infrastructure는 상위 계층을 모른다"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.api", "app.core", "app.runtime"]

[[tool.importlinter.contracts]]
# 파일만 나누고 서로 참조하면 쪼갠 게 아니다. 여기가 깨지면 하위도메인 경계를
# 잘못 그은 것이므로 파일을 합치든 경계를 다시 긋든 결정해야 한다.
name = "도메인 하위도메인은 서로 독립"
type = "independence"
modules = [
    "app.domain.device",
    "app.domain.readings",
    "app.domain.alerting",
    "app.domain.access",
    "app.domain.push",
]

[[tool.importlinter.contracts]]
name = "port끼리 서로 모른다"
type = "independence"
modules = [
    "app.domain.ports.clock",
    "app.domain.ports.frame_source",
    "app.domain.ports.push_sender",
]

[[tool.importlinter.contracts]]
# 저장소 간 호출은 트랜잭션 경계를 흐린다 — 조합은 서비스에서만.
name = "저장소끼리 서로 모른다"
type = "independence"
modules = [
    "app.infrastructure.db.repositories.devices",
    "app.infrastructure.db.repositories.readings",
    "app.infrastructure.db.repositories.alerts",
    "app.infrastructure.db.repositories.events",
    "app.infrastructure.db.repositories.access_tokens",
    "app.infrastructure.db.repositories.push_tokens",
    "app.infrastructure.db.repositories.push_deliveries",
]

[[tool.importlinter.contracts]]
name = "하드웨어·외부 SDK는 전용 어댑터에만"
type = "forbidden"
# 조립부(runtime)는 어댑터를 import하므로 전이적으로 걸린다 — 제외한다.
source_modules = ["app.api", "app.core", "app.domain", "app.infrastructure.db"]
forbidden_modules = ["spidev"]
